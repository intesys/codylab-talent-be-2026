openapi: 3.1.0
info:
  title: CodyLab OpenAPI definition
  version: v0
paths:
  /api/auth/login:
    post:
      tags:
        - auth-controller
      summary: User login
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
  /projects:
    get:
      tags:
        - project-controller
      summary: Get all projects
      operationId: getAllProjects
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags:
        - project-controller
      summary: Create a new project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - project-controller
      summary: Get a project by ID
      operationId: getProjectById
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
        - project-controller
      summary: Update an existing project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
        - project-controller
      summary: Delete a project
      operationId: deleteProject
      responses:
        '204':
          description: Project deleted successfully
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /activities:
    get:
      tags:
        - activity-controller
      summary: Get all activities
      operationId: getAllActivities
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
    post:
      tags:
        - activity-controller
      summary: Create a new activity
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        '201':
          description: Activity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /activities/{activityId}:
    parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - activity-controller
      summary: Get an activity by ID
      operationId: getActivityById
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
        - activity-controller
      summary: Update an existing activity
      operationId: updateActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        '200':
          description: Activity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
        - activity-controller
      summary: Delete an activity
      operationId: deleteActivity
      responses:
        '204':
          description: Activity deleted successfully
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          examples: ['mrossi']
        password:
          type: string
          examples: ['password1']
      required:
        - username
        - password

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [1]
        name:
          type: string
          examples: ['Mario']
        surname:
          type: string
          examples: ['Rossi']
        username:
          type: string
          examples: ['mrossi']
        accessToken:
          type: string
          examples: ['eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...']
        createDate:
          type: string
          format: date
          examples: ['2026-06-01']
        updateDate:
          type: string
          format: date
          nullable: true
          examples: [null]
      required:
        - username
        - name
        - surname

    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [1]
        title:
          type: string
          examples: ['CRM Aziendale']
        description:
          type: string
          examples: ['Sviluppo di un CRM interno per gestione clienti']
        estimatedHours:
          type: integer
          format: int32
          description: Estimated hours for the project
          examples: [320]
        status:
          type: string
          enum:
            - CREATED
            - WORKING
            - STANDBY
            - COMPLETED
            - CLOSED
          examples: ['CREATED']
        startDate:
          type: string
          format: date
          examples: ['2026-06-03']
        endDate:
          type: string
          format: date
          examples: ['2026-08-30']
        customerId:
          type: integer
          format: int64
          description: Identifier of the customer associated with the project
          examples: [1]
        createDate:
          type: string
          format: date
          examples: ['2026-06-01']
        updateDate:
          type: string
          format: date
          nullable: true
          examples: [null]
      required:
        - title
        - estimatedHours
        - status
        - startDate
        - endDate
        - customerId

    Activity:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique activity identifier
          examples: [1]
        name:
          type: string
          description: Name of the activity
          examples: ['Analisi requisiti CRM']
        estimatedHours:
          type: integer
          format: int32
          description: Estimated duration in hours
          examples: [40]
        projectId:
          type: integer
          format: int64
          description: Identifier of the project that contains the activity
          examples: [1]
        createDate:
          type: string
          format: date
          description: Date when the activity was created
          examples: ['2026-06-01']
        updateDate:
          type: string
          format: date
          nullable: true
          description: Date of the latest activity update
          examples: [null]
      required:
        - name
        - estimatedHours
        - projectId

    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          default: 'about:blank'
          examples: ['https://zalando.github.io/problem/constraint-violation']
        title:
          type: string
          examples: ['Service Unavailable']
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 600
          examples: [503]
        detail:
          type: string
          examples: ['Connection to database timed out']
        instance:
          type: string
          format: uri
          examples: ['https://example.com/problem/12345']